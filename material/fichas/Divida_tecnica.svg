  <line x1="294" y1="46" x2="776" y2="46" stroke="#ADB5BD" stroke-width="1.5"/>
  <text x="24.0" y="80.0" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, 'DejaVu Sans', sans-serif" font-size="18" text-anchor="start" style="fill:#212529;font-weight:700">Por que não foi corrigido</text>
