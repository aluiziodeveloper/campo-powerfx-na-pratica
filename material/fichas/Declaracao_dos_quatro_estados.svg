<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 416" role="img" aria-labelledby="titulo descricao">
  <title id="titulo">A declaração dos quatro estados de uma tela.</title>
  <desc id="descricao">Declaração em branco dos quatro estados de uma tela: o nome da tela; com dado; vazio, de início, de filtro ou suspeito, com o texto e a ação; carregando, onde aparece; com erro, o que aconteceu e o que fazer.</desc>
  <defs>
  </defs>
  <rect width="800" height="416" fill="#FFFFFF"/>
  <rect x="14" y="8" width="772" height="382" rx="6" fill="#FFFFFF" stroke="#ADB5BD" stroke-width="1.5"/>
  <text x="24.0" y="42.0" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, 'DejaVu Sans', sans-serif" font-size="22" text-anchor="start" style="fill:#1F5F7A;font-weight:700">TELA:</text>
  <line x1="24" y1="58" x2="776" y2="58" stroke="#1F5F7A" stroke-width="2"/>
  <line x1="104" y1="46" x2="776" y2="46" stroke="#ADB5BD" stroke-width="1.5"/>
  <text x="24.0" y="96.0" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, 'DejaVu Sans', sans-serif" font-size="18" text-anchor="start" style="fill:#212529;font-weight:700">COM DADO</text>
  <line x1="294" y1="98" x2="776" y2="98" stroke="#ADB5BD" stroke-width="1.5"/>
  <text x="24.0" y="132.0" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, 'DejaVu Sans', sans-serif" font-size="18" text-anchor="start" style="fill:#212529;font-weight:700">VAZIO</text>
  <rect x="194" y="115" width="20" height="20" rx="3" fill="#FFFFFF" stroke="#212529" stroke-width="1.5"/>
  <text x="222.0" y="132.0" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, 'DejaVu Sans', sans-serif" font-size="18" text-anchor="start" style="fill:#212529">de início</text>
  <rect x="323.5406" y="115" width="20" height="20" rx="3" fill="#FFFFFF" stroke="#212529" stroke-width="1.5"/>
  <text x="351.5" y="132.0" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, 'DejaVu Sans', sans-serif" font-size="18" text-anchor="start" style="fill:#212529">de filtro</text>
  <rect x="447.5714" y="115" width="20" height="20" rx="3" fill="#FFFFFF" stroke="#212529" stroke-width="1.5"/>
  <text x="475.6" y="132.0" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, 'DejaVu Sans', sans-serif" font-size="18" text-anchor="start" style="fill:#212529">suspeito</text>
  <text x="24.0" y="168.0" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, 'DejaVu Sans', sans-serif" font-size="18" text-anchor="start" style="fill:#212529;font-weight:700">texto</text>
  <line x1="294" y1="170" x2="776" y2="170" stroke="#ADB5BD" stroke-width="1.5"/>
  <text x="24.0" y="204.0" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, 'DejaVu Sans', sans-serif" font-size="18" text-anchor="start" style="fill:#212529;font-weight:700">ação</text>
  <line x1="294" y1="206" x2="776" y2="206" stroke="#ADB5BD" stroke-width="1.5"/>
  <text x="24.0" y="240.0" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, 'DejaVu Sans', sans-serif" font-size="18" text-anchor="start" style="fill:#212529;font-weight:700">CARREGANDO: onde</text>
  <text x="24.0" y="264.0" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, 'DejaVu Sans', sans-serif" font-size="18" text-anchor="start" style="fill:#212529;font-weight:700">aparece</text>
  <line x1="294" y1="266" x2="776" y2="266" stroke="#ADB5BD" stroke-width="1.5"/>
  <text x="24.0" y="300.0" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, 'DejaVu Sans', sans-serif" font-size="18" text-anchor="start" style="fill:#212529;font-weight:700">COM ERRO: o que</text>
  <text x="24.0" y="324.0" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, 'DejaVu Sans', sans-serif" font-size="18" text-anchor="start" style="fill:#212529;font-weight:700">aconteceu</text>
  <line x1="294" y1="326" x2="776" y2="326" stroke="#ADB5BD" stroke-width="1.5"/>
  <text x="24.0" y="360.0" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, 'DejaVu Sans', sans-serif" font-size="18" text-anchor="start" style="fill:#212529;font-weight:700">o que fazer</text>
  <line x1="294" y1="362" x2="776" y2="362" stroke="#ADB5BD" stroke-width="1.5"/>
